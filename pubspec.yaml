name: remote_controller
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev



environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  android_tv_remote_package: ^1.0.0+1
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  multicast_dns: ^0.3.3+1
  file_picker: ^11.0.2
  image_picker: ^1.1.2
  dio: ^5.8.0+1
  http: ^1.5.0
  url_launcher: ^6.3.0
  google_mobile_ads: ^9.0.0
  firebase_remote_config: ^5.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_core: ^3.6.0
  purchases_flutter:
  shimmer: ^3.0.0
  package_info_plus: ^8.0.3
  share_plus: ^10.0.0
  fluttertoast: ^8.2.4
  app_tracking_transparency: ^2.0.4
  in_app_review: ^2.0.9
  lottie: ^3.1.0
  flutter_screenutil: ^5.9.0
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^6.0.0
  permission_handler: ^11.1.0
  path_provider: ^2.1.1
  uuid: ^4.3.3
  get: ^4.6.6
  video_player: ^2.11.1
  flutter_inset_shadow: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:


  uses-material-design: true
  assets:
    - assets/bgswitch.png
    - assets/tab/
    - assets/tv images/
    - assets/apps/
    - assets/casting/
    - assets/home/
    - assets/intro/
    - assets/intro/intro_videos/intro_1.mp4
    - assets/intro/intro_videos/intro_2.mp4
    - assets/intro/intro_videos/intro_3.mp4
    - assets/premium/
    - assets/settting/
    - assets/splash/
    - assets/survay & rate/
    - assets/sf-pro-display/
    - assets/Geist-VariableFont_wght.ttf
    - assets/process.json

  fonts:
    - family: Geist
      fonts:
        - asset: assets/Geist-VariableFont_wght.ttf
    - family: SF Pro Display
      fonts:
        - asset: assets/sf-pro-display/SFPRODISPLAYREGULAR.OTF
        - asset: assets/sf-pro-display/SFPRODISPLAYMEDIUM.OTF
          weight: 500
        - asset: assets/sf-pro-display/SFPRODISPLAYBOLD.OTF
          weight: 700
        - asset: assets/sf-pro-display/SFPRODISPLAYBLACKITALIC.OTF
          weight: 900
          style: italic
        - asset: assets/sf-pro-display/SFPRODISPLAYHEAVYITALIC.OTF
          weight: 800
          style: italic
        - asset: assets/sf-pro-display/SFPRODISPLAYSEMIBOLDITALIC.OTF
          weight: 600
          style: italic
        - asset: assets/sf-pro-display/SFPRODISPLAYLIGHTITALIC.OTF
          weight: 300
          style: italic
        - asset: assets/sf-pro-display/SFPRODISPLAYTHINITALIC.OTF
          weight: 100
          style: italic
        - asset: assets/sf-pro-display/SFPRODISPLAYULTRALIGHTITALIC.OTF
          weight: 200
          style: italic
